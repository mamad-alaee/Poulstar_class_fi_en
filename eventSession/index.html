<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="logic.js" defer></script>
    <style>
        #mainBody{
            width: 100%;
            height: 100vh;
            background-color: antiquewhite;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
        }
        #calculatorDiv{
            width: 30%;
            height: 40%;
            background-color: white;
            box-shadow: 2px 2px 2px 2px gray;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .calculatorTitle{
            font-weight: 600;
            font-size: x-large;
            color: green;
        }
        #calculateBtn{
            background-color: green;
            color: white;
            width: 50%;
            height: 10%;
            border: none;
            border-radius: 8px;
        }
        .inputBox{
            width: 50%;
            height: 10%;
            border: 2px solid green;
            border-radius: 8px;
            padding-left: 8px;
            padding-right: 8px;
        }

    </style>
</head>
<body id="mainBody">
   <div id="calculatorDiv">
        <h1 class="calculatorTitle">Calculate</h1>
        <input class="inputBox" type="text" id="num1Txt" placeholder="insert number 1 ...">
        <!-- <input class="inputBox" type="text" id="operatorTxt" placeholder="insert operator ..."> -->
        <input class="inputBox" type="text" id="num2Txt" placeholder="insert number 2 ...">
        <button onclick="calculate()" 
        id="calculateBtn">calculate</button>
        <h1 class="calculatorTitle" id="resultTxt" >Result ....</h1>
   </div>
    
</body>
</html>
